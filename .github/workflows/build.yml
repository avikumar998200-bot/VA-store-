name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix Android Build to 36
        run: |
          flutter create . --platforms=android
          # App ka 36
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          # Saare library ko bhi 36 force
          echo "subprojects { afterEvaluate { if (hasProperty('android')) { android { compileSdk = 36 } } } }" >> android/app/build.gradle.kts
          echo "android { compileSdk = 36 }" >> android/build.gradle.kts || true
          flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
