name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
      - name: Fix Android V1 + SDK 36
        run: |
          set +e
          rm -rf android || true
          flutter create . --platforms=android --org com.avira.store || true
          mkdir -p android/app || true
          echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.avira.store.avira"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json || true
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true
          echo "done"
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk