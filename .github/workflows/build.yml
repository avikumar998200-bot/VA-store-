name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix Android Build
        run: |
          flutter create . --platforms=android
          # build.gradle.kts me 33 -> 34
          sed -i 's/compileSdk = 33/compileSdk = 34/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle.kts || true
          sed -i 's/minSdk = 16/minSdk = 23/g' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = 33/targetSdk = 34/g' android/app/build.gradle.kts || true
          # purane gradle file ke liye bhi
          sed -i 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle || true
          flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
